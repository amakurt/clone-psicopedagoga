# =========================================================================
# CONFIGURAÇÃO NGINX - EDUPSYCH PRO SAAS (HOSTINGER VPS KVM 2)
# =========================================================================
# Substitua 'app.seudominio.com.br' pelo seu domínio real.

# 1. Redirecionamento HTTP -> HTTPS (Automático após rodar o Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name app.seudominio.com.br;

    # Certbot acme-challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.seudominio.com.br;

    # Certificados SSL (Preenchidos automaticamente pelo Certbot)
    ssl_certificate /etc/letsencrypt/live/app.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.seudominio.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM;

    # Tamanho máximo de upload de fotos de pacientes e laudos
    client_max_body_size 50M;

    # Compressão GZIP para carregamento ultra-rápido do Angular
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Diretório dos arquivos estáticos compilados do Angular
    root /var/www/edupsych/dist/browser;
    index index.html;

    # Roteamento de API para o Backend Node.js Express (Porta 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Arquivos estáticos de Uploads (Fotos, Comprovantes e Anexos)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de arquivos estáticos do frontend (JS, CSS, Imagens, Fontes)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA do Angular (Todas as rotas redirecionam para index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
